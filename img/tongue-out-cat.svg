<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-label="Cat with tongue out">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff6ea"/>
      <stop offset="100%" stop-color="#ffe1c4"/>
    </linearGradient>
  </defs>
  <rect width="300" height="260" fill="none"/>
  <g transform="translate(20 10)">
    <!-- head -->
    <path d="M60 170 C30 123, 38 54, 96 36 C146 22, 211 30, 246 76 C272 112, 267 168, 240 196 C214 222, 174 232, 128 232 C90 232, 74 214, 60 170 Z" fill="#111111"/>

    <!-- ears -->
    <path d="M88 34 L110 8 L126 42 Z" fill="#111111"/>
    <path d="M210 34 L192 8 L176 42 Z" fill="#111111"/>

    <!-- inner ears -->
    <path d="M99 30 L111 16 L121 35 Z" fill="#ffb7c5" opacity="0.8"/>
    <path d="M199 30 L190 16 L180 35 Z" fill="#ffb7c5" opacity="0.8"/>

    <!-- eyes -->
    <ellipse cx="122" cy="104" rx="18" ry="22" fill="#f7f7f7"/>
    <ellipse cx="184" cy="104" rx="18" ry="22" fill="#f7f7f7"/>
    <circle cx="126" cy="110" r="7" fill="#111111"/>
    <circle cx="180" cy="110" r="7" fill="#111111"/>

    <!-- nose -->
    <path d="M150 120 L164 120 L157 132 Z" fill="#ff9db2"/>

    <!-- whiskers -->
    <g stroke="#f5f5f5" stroke-width="3" stroke-linecap="round">
      <path d="M88 136 L37 125"/>
      <path d="M88 150 L35 148"/>
      <path d="M88 166 L38 172"/>
      <path d="M214 136 L263 125"/>
      <path d="M214 150 L266 148"/>
      <path d="M214 166 L264 172"/>
    </g>

    <!-- tongue -->
    <path d="M128 150 Q150 180 172 150 Q170 192 150 200 Q129 191 128 150 Z" fill="#ff4d6d"/>
    <path d="M150 175 Q160 183 165 197" fill="none" stroke="#d8294b" stroke-width="4" stroke-linecap="round"/>

    <!-- little blush -->
    <circle cx="97" cy="132" r="8" fill="#ff9ab0" opacity="0.7"/>
    <circle cx="204" cy="132" r="8" fill="#ff9ab0" opacity="0.7"/>
  </g>
</svg>
