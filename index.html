<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Catch</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        background: #c24343;
        font-family: 'Patrick Hand', cursive;
        color: #fff;
        overflow-x: hidden;
      }

      .page {
        width: min(92vw, 760px);
        margin: 0 auto;
        padding: 22px 0 42px;
      }

      .cat-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 54px;
      }

      .tap-note {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
        text-shadow: 0 4px 12px rgba(0,0,0,0.12);
        white-space: nowrap;
      }

      .cat-wrap img {
        display: block;
        width: min(62vw, 300px);
        height: auto;
        filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.26));
      }

      .cat-heart {
        position: absolute;
        left: 50%;
        top: 60%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%) rotate(-45deg);
        background: #ff4d6d;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.12);
        z-index: 3;
      }

      .cat-heart::before,
      .cat-heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: #ff4d6d;
        border-radius: 50%;
      }

      .cat-heart::before {
        top: -10px;
        left: 0;
      }

      .cat-heart::after {
        left: 10px;
        top: 0;
      }

      .cat-heart.is-activated {
        animation: heart-activate 0.55s ease;
      }

      .cat-stop {
        position: absolute;
        top: calc(100% + 7px);
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        z-index: 4;
      }

      .cat-stop::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: currentColor;
      }

      .cat-stop:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      @keyframes heart-activate {
        45% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.45); }
      }

      .cat-message {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%) scale(0.8);
        font-family: 'Patrick Hand', cursive;
        font-size: clamp(1.6rem, 3vw, 3rem);
        color: white;
        letter-spacing: 0.04em;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 6px 18px rgba(0,0,0,0.25);
        transition: opacity 0.3s ease, transform 0.3s ease;
        white-space: nowrap;
      }

      .cat-message.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .game-shell {
        position: relative;
        width: 100%;
        height: 480px;
        border: 4px solid rgba(255, 255, 255, 0.75);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 16px 30px rgba(93, 18, 31, 0.14);
        overflow: hidden;
      }

      .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px 10px;
        z-index: 10;
      }

      .score-box,
      .combo-box {
        background: rgba(255, 255, 255, 0.2);
        border: 3px solid rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        padding: 6px 12px;
        font-size: clamp(1.15rem, 2.1vw, 1.8rem);
        color: #fff7f9;
      }

      .game-area {
        position: absolute;
        inset: 68px 12px 18px 12px;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        touch-action: none;
      }

      .basket {
        --basket-x: 50%;
        position: absolute;
        left: var(--basket-x);
        bottom: 18px;
        width: 150px;
        height: 86px;
        transform: translateX(-50%);
        z-index: 9;
        transition: left 0.08s linear;
      }

      .basket-handle {
        position: absolute;
        left: 50%;
        top: 6px;
        width: 106px;
        height: 44px;
        transform: translateX(-50%);
        border: 5px solid #c98a3a;
        border-bottom: none;
        border-radius: 60px 60px 0 0;
        background: transparent;
      }

      .basket-body {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 100%;
        height: 56px;
        transform: translateX(-50%);
        background: #f7d38d;
        border: 4px solid #bc7d2d;
        border-bottom-width: 8px;
        border-radius: 16px 16px 20px 20px;
        box-shadow: inset 0 -8px 0 rgba(138, 87, 31, 0.18);
      }

      .basket-body::before,
      .basket-body::after {
        content: "";
        position: absolute;
        bottom: 12px;
        width: 18px;
        height: 28px;
        border-radius: 50%;
        border: 4px solid #bc7d2d;
        border-bottom: none;
        background: transparent;
      }

      .basket-body::before { left: 18px; }
      .basket-body::after { right: 18px; }

      .heart {
        position: absolute;
        width: 30px;
        height: 30px;
        left: 0;
        top: 0;
        transform: rotate(-45deg);
        z-index: 7;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.12));
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: inherit;
      }

      .heart::before {
        top: -15px;
        left: 0;
      }

      .heart::after {
        left: 15px;
        top: 0;
      }

      .heart.falling {
        animation: bob 0.7s ease-in-out infinite alternate;
      }

      @keyframes bob {
        0% { transform: rotate(-45deg) translateY(0) scale(1); }
        50% { transform: rotate(-48deg) translateY(2px) scale(1.04); }
        100% { transform: rotate(-42deg) translateY(-2px) scale(0.97); }
      }

      .heart.catch {
        animation: popIn 0.42s ease forwards;
      }

      @keyframes popIn {
        0% { transform: rotate(-45deg) scale(1); opacity: 1; }
        30% { transform: rotate(-45deg) scale(1.5); }
        100% { transform: rotate(-45deg) scale(0.25); opacity: 0; }
      }

      .message {
        position: absolute;
        left: 50%;
        top: 24%;
        transform: translateX(-50%);
        font-size: clamp(1.15rem, 2vw, 1.7rem);
        color: #fff;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 12;
        white-space: nowrap;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      }

      .message.show {
        opacity: 1;
      }

      .game-over {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: rgba(194, 67, 67, 0.8);
        z-index: 15;
        font-size: clamp(2rem, 4vw, 4rem);
        color: #fff;
        letter-spacing: 0.04em;
      }

      .game-over-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px;
      }

      .game-over-inner img {
        width: min(34vw, 180px);
        height: auto;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
      }

      .game-over.show {
        display: flex;
      }

      .song-audio {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="cat-wrap">
        <div class="tap-note">Tap On Heart</div>
        <img
          src="img/download_-_2026-10-02T212406.385-removebg-preview.png"
          alt="Black cat"
        />
        <button class="cat-heart" aria-label="Tap the heart"></button>
        <div class="cat-message" aria-live="polite">Happy Boyfriend Day</div>
        <button class="cat-stop" id="stopAudio" type="button" aria-label="Stop audio" title="Stop audio"></button>
      </div>

      <div class="game-shell">
        <div class="hud">
          <div class="score-box">Score: <span id="score">0</span></div>
          <div class="combo-box">Combo: <span id="combo">0</span></div>
        </div>

        <div class="game-area" id="gameArea">
          <div class="basket" id="basket" aria-label="basket">
            <div class="basket-handle"></div>
            <div class="basket-body"></div>
          </div>
        </div>

        <div class="message" id="message">Nice catch!</div>
        <div class="game-over" id="gameOver">
          <div class="game-over-inner">
            <img src="img/Screenshot_2026-10-02_214939-removebg-preview.png" alt="Tongue out emoji" style="width: 90px; height: auto; display: inline-block; vertical-align: middle; margin-right: 8px; background: transparent; filter: none;" />
            <div>Who is my good boy?</div>
          </div>
        </div>
      </div>
    </div>

    <audio id="songAudio" class="song-audio" preload="metadata">
      <source src="audio-file.mpeg" type="audio/mpeg" />
    </audio>

    <script>
      const gameArea = document.getElementById('gameArea');
      const basket = document.getElementById('basket');
      const scoreEl = document.getElementById('score');
      const comboEl = document.getElementById('combo');
      const messageEl = document.getElementById('message');
      const gameOverEl = document.getElementById('gameOver');
      const catHeart = document.querySelector('.cat-heart');
      const catMessage = document.querySelector('.cat-message');
      const songAudio = document.getElementById('songAudio');
      const stopAudio = document.getElementById('stopAudio');

      const heartColors = ['#ff4d6d', '#ff8fab', '#7f6bff', '#7fdbff', '#ffb703', '#b392f5', '#ff6f91'];
      const hearts = [];

      let score = 0;
      let combo = 0;
      let basketX = 50;
      let pointerX = 50;
      let keys = { left: false, right: false };
      let lastTime = 0;
      let spawnTimer = 0;
      let gameEnded = false;
      let restartTimeout = null;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function setBasketPosition(xPercent) {
        basketX = clamp(xPercent, 10, 90);
        basket.style.setProperty('--basket-x', basketX + '%');
      }

      function updateScoreDisplay() {
        scoreEl.textContent = score;
        comboEl.textContent = combo;
      }

      function showMessage(text) {
        messageEl.textContent = text;
        messageEl.classList.add('show');
        clearTimeout(showMessage.timeoutId);
        showMessage.timeoutId = setTimeout(() => {
          messageEl.classList.remove('show');
        }, 500);
      }

      function updateBasketFromInput() {
        if (keys.left && !keys.right) pointerX -= 3.2;
        if (keys.right && !keys.left) pointerX += 3.2;
        pointerX = clamp(pointerX, 10, 90);
        setBasketPosition(pointerX);
      }

      function createHeart() {
        const heart = document.createElement('div');
        heart.className = 'heart falling';

        const size = 24 + Math.random() * 18;
        const x = 8 + Math.random() * 84;
        const color = heartColors[Math.floor(Math.random() * heartColors.length)];

        heart.style.width = size + 'px';
        heart.style.height = size + 'px';
        heart.style.left = x + '%';
        heart.style.top = '-10%';
        heart.style.background = color;

        const data = {
          el: heart,
          x,
          y: -10,
          speed: 0.9 + score * 0.06 + Math.random() * 0.7,
          sway: (Math.random() * 1.8 - 0.9),
          caught: false,
        };

        hearts.push(data);
        gameArea.appendChild(heart);
      }

      function resetGame() {
        score = 0;
        combo = 0;
        basketX = 50;
        pointerX = 50;
        spawnTimer = 0;
        gameEnded = false;
        setBasketPosition(50);
        updateScoreDisplay();

        hearts.forEach((heartData) => heartData.el.remove());
        hearts.length = 0;

        gameOverEl.classList.remove('show');
        messageEl.classList.remove('show');
      }

      function endGame() {
        if (gameEnded) return;
        gameEnded = true;
        gameOverEl.classList.add('show');
        showMessage('Perfect!');

        hearts.forEach((heartData) => {
          heartData.el.remove();
        });
        hearts.length = 0;

        restartTimeout = setTimeout(() => {
          resetGame();
        }, 10000);
      }

      function handleCatch(heartData) {
        if (gameEnded) return;

        heartData.caught = true;
        combo += 1;
        score += 1;
        updateScoreDisplay();

        heartData.el.classList.remove('falling');
        heartData.el.classList.add('catch');
        heartData.el.style.left = basketX + '%';
        heartData.el.style.top = 'calc(100% - 70px)';
        heartData.el.style.transform = 'translateX(-50%) rotate(-45deg) scale(1.4)';

        showMessage(combo > 1 ? 'Combo x' + combo : 'Nice catch!');

        if (score >= 10) {
          endGame();
        }

        setTimeout(() => {
          if (heartData.el && heartData.el.parentNode) {
            heartData.el.remove();
          }
          const index = hearts.indexOf(heartData);
          if (index !== -1) hearts.splice(index, 1);
        }, 450);
      }

      function updateFrame(delta) {
        if (gameEnded) return;

        updateBasketFromInput();

        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          createHeart();
          spawnTimer = Math.max(500, 1200 - score * 18);
        }

        for (let i = hearts.length - 1; i >= 0; i--) {
          const heartData = hearts[i];
          if (heartData.caught) continue;

          heartData.y += heartData.speed * delta * 0.06;
          heartData.x += heartData.sway * delta * 0.04;

          const xPx = (heartData.x / 100) * gameArea.clientWidth;
          const yPx = heartData.y / 100 * gameArea.clientHeight;

          heartData.el.style.left = xPx + 'px';
          heartData.el.style.top = yPx + 'px';

          const basketRect = basket.getBoundingClientRect();
          const heartRect = heartData.el.getBoundingClientRect();

          const overlapX = heartRect.left < basketRect.right - 12 && heartRect.right > basketRect.left + 12;
          const overlapY = heartRect.bottom >= basketRect.top - 10 && heartRect.bottom <= basketRect.top + 22;

          if (overlapX && overlapY) {
            handleCatch(heartData);
            continue;
          }

          if (heartData.y > 120) {
            hearts.splice(i, 1);
            heartData.el.remove();
            combo = 0;
            updateScoreDisplay();
          }
        }
      }

      function gameLoop(timestamp) {
        const delta = timestamp - lastTime || 16;
        lastTime = timestamp;
        updateFrame(delta);
        requestAnimationFrame(gameLoop);
      }

      catHeart.addEventListener('click', () => {
        catMessage.classList.add('show');
        catHeart.classList.remove('is-activated');
        void catHeart.offsetWidth;
        catHeart.classList.add('is-activated');

        songAudio.currentTime = 37.5;
        songAudio.play().catch((error) => {
          console.error('The attached audio could not be played.', error);
        });

        setTimeout(() => catMessage.classList.remove('show'), 1100);
      });

      stopAudio.addEventListener('click', () => {
        songAudio.pause();
        songAudio.currentTime = 37.5;
      });

      document.addEventListener('pointermove', (event) => {
        const rect = gameArea.getBoundingClientRect();
        pointerX = ((event.clientX - rect.left) / rect.width) * 100;
        setBasketPosition(pointerX);
      });

      document.addEventListener('touchmove', (event) => {
        if (event.touches.length > 0) {
          const rect = gameArea.getBoundingClientRect();
          const touchX = (event.touches[0].clientX - rect.left) / rect.width * 100;
          pointerX = clamp(touchX, 10, 90);
          setBasketPosition(pointerX);
        }
      }, { passive: true });

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (event.key === 'ArrowLeft' || key === 'a') keys.left = true;
        if (event.key === 'ArrowRight' || key === 'd') keys.right = true;
      });

      document.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (event.key === 'ArrowLeft' || key === 'a') keys.left = false;
        if (event.key === 'ArrowRight' || key === 'd') keys.right = false;
      });

      setBasketPosition(50);
      updateScoreDisplay();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
